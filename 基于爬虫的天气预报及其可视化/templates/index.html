<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071012">
    <meta name="description" content="Atmos 智能气象台：实时天气、七日预报、紫外线、湿度、风向与生活建议。">
    <title>Atmos · 智能气象台</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='2.0.2') }}">
</head>
<body class="landing-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ambient-three" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
        <a class="brand" href="/" aria-label="Atmos 首页">
            <span class="brand-mark" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
            <span class="brand-text">ATMOS<small>智能气象台</small></span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a href="#search-panel">城市天气</a>
            <a href="/weather.html?city=北京">今日观察</a>
            <span class="live-pill"><i></i> 数据在线</span>
        </nav>
    </header>

    <main class="landing-main">
        <section class="landing-copy">
            <div class="eyebrow reveal">
                <span class="eyebrow-line"></span>
                WEATHER, INTERPRETED
            </div>
            <h1 class="reveal delay-one">
                读懂天空，<br>
                <em>安排今天。</em>
            </h1>
            <p class="landing-lead reveal delay-two">
                不只告诉你几度。把温度、湿度、风向、紫外线与未来七日变化，
                翻译成一份真正可执行的生活建议。
            </p>
            <div class="city-shortcuts reveal delay-three" aria-label="热门城市">
                <span>快捷进入</span>
                <button type="button" data-city="北京">北京</button>
                <button type="button" data-city="上海">上海</button>
                <button type="button" data-city="成都">成都</button>
                <button type="button" data-city="深圳">深圳</button>
            </div>
            <div class="landing-footnote reveal delay-four">
                <div class="signal-icon" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>
                <p>覆盖全国 2,500+ 城市<br><span>数据来自中国天气网 · 每 15 分钟智能缓存</span></p>
            </div>
        </section>

        <section class="search-panel glass-card reveal delay-two" id="search-panel">
            <div class="panel-topline">
                <span>快速观测</span>
                <span id="panel-clock">--:--</span>
            </div>
            <div class="panel-heading">
                <p>你所在的城市</p>
                <h2>此刻天空，<br>是什么心情？</h2>
            </div>

            <form id="city-search-form" class="search-form" role="search">
                <label class="sr-only" for="city-search">输入城市名称</label>
                <div class="search-control" data-autocomplete>
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
                    </span>
                    <input
                        id="city-search"
                        name="city"
                        type="search"
                        placeholder="北京 / beijing / 海淀"
                        autocomplete="off"
                        spellcheck="false"
                        aria-autocomplete="list"
                        aria-controls="search-suggestions"
                    >
                    <button class="submit-button" type="submit" aria-label="查询天气">
                        <span class="button-label">开始观测</span>
                        <span class="button-spinner" aria-hidden="true"></span>
                        <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                    </button>
                    <div class="suggestion-list" id="search-suggestions" role="listbox" hidden></div>
                </div>
                <p class="form-hint">支持城市名、简称、拼音与轻微错字纠正</p>
            </form>

            <button class="location-button" id="location-button" type="button">
                <span class="location-pulse" aria-hidden="true"></span>
                <span>使用当前位置</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"></path><circle cx="12" cy="10" r="2"></circle></svg>
            </button>

            <div class="recent-searches" id="recent-searches" hidden>
                <div class="recent-title">
                    <span>最近查看</span>
                    <button type="button" id="clear-recent">清除</button>
                </div>
                <div class="recent-list" id="recent-list"></div>
            </div>

            <div class="panel-footer">
                <div class="mini-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
                <p>实时采集 · 智能分析<br><span>今日建议会随天气一起更新</span></p>
            </div>
        </section>
    </main>

    <div class="scroll-cue" aria-hidden="true">
        <span></span>
        <p>SCROLL TO EXPLORE</p>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='js/common.js', v='2.0.2') }}" defer></script>
    <script src="{{ url_for('static', filename='js/index.js', v='2.0.2') }}" defer></script>
</body>
</html>
